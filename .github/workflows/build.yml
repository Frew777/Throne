name: Throne build Windows x64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag and version"
        required: true
      publish:
        description: "r for normal release, p for prerelease, leave empty to not publish anything"
        required: false

jobs:
  build-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.5
      - name: Build Go parts
        run: |
          GOOS=windows GOARCH=amd64 ./script/build_go.sh
      - name: Package artifacts
        run: tar czvf artifacts.tgz ./deployment
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Throne-${{ github.sha }}-windows-amd64
          path: artifacts.tgz

  build-cpp:
    runs-on: windows-latest
    needs: build-go
    permissions:
      contents: read
    env:
      INPUT_VERSION: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1.13
        with:
          arch: x86_64
      - name: Download Go artifacts
        uses: actions/download-artifact@v4
        with:
          path: download-artifact
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          setup-python: true
          cache: true
      - name: Build C++ project
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=RelWithDebInfo ..
          ninja
      - name: Package deployment
        shell: cmd
        run: |
          tar czvf artifacts.tgz ./deployment
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Throne-${{ github.sha }}-windows-x64
          path: artifacts.tgz

  publish:
    runs-on: ubuntu-latest
    needs: build-cpp
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: deployment
      - name: Publish release
        if: github.event.inputs.publish == 'r'
        run: |
          ./ghr -delete -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" "${{ github.event.inputs.tag }}" deployment
      - name: Publish prerelease
        if: github.event.inputs.publish == 'p'
        run: |
          ./ghr -prerelease -delete -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" "${{ github.event.inputs.tag }}" deployment
